name: CI

on:
  push:
    branches: [main, Backend]
  pull_request:
    branches: [main]

jobs:

  test-backend:
    name: Backend — Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer les tests
        run: pytest tests/ -v

  lint-backend:
    name: Backend — Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier les imports et la syntaxe
        run: python -m py_compile app/main.py

  build-frontend:
    name: Frontend — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Linter
        run: npm run lint

      - name: Build de production
        run: npm run build

  build-docker:
    name: Docker — Build des images
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build image Backend
        run: docker build -t artisanconnect-backend ./Backend

      - name: Build image Frontend
        run: docker build -t artisanconnect-frontend ./Frontend
